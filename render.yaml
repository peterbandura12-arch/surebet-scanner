# Render Blueprint for SUREBET SCANNER
# Deploy: https://dashboard.render.com/select-repo (Blueprint) — no CLI required.
# Database: use any external Postgres (Supabase free tier recommended).
# Create a project at https://supabase.com, then in Render -> surebet-api
# -> Environment set DATABASE_URL to the Supabase "Session pooler" URI.

services:
  - type: web
    name: surebet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head || echo 'migration skipped, app will create schema'; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        sync: false # paste your Supabase Session pooler URI here
      - key: FEED_AUTOSTART
        value: "1"
      - key: FEED_TICK_SECONDS
        value: "6"
      - key: DEMO_SEED
        value: "20240601"
      - key: MIN_ROI_PCT
        value: "0.5"
      - key: ODDS_MAX_AGE_SECONDS
        value: "180"
      - key: CORS_ORIGINS
        sync: false # set to your frontend URL, e.g. https://surebet-scanner.vercel.app
      - key: THEODDSAPI_KEY
        sync: false # optional; leave empty for pure demo mode
      - key: THEODDSAPI_SPORTS
        value: soccer_epl
      - key: THEODDSAPI_MARKETS
        value: h2h,spreads,totals
      - key: THEODDSAPI_MIN_INTERVAL_SECONDS
        value: "60"

  - type: web
    name: surebet-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to your backend URL, e.g. https://surebet-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # set to wss://surebet-api.onrender.com/ws/live

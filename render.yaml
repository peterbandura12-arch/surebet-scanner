# Render Blueprint for SUREBET SCANNER
# Deploy: https://dashboard.render.com/select-repo (Blueprint) — no CLI required.
databases:
  - name: surebet-db
    databaseName: surebet
    plan: free

services:
  - type: web
    name: surebet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surebet-db
          property: connectionString
      - key: FEED_AUTOSTART
        value: "1"
      - key: FEED_TICK_SECONDS
        value: "6"
      - key: DEMO_SEED
        value: "20240601"
      - key: MIN_ROI_PCT
        value: "0.5"
      - key: ODDS_MAX_AGE_SECONDS
        value: "180"
      - key: CORS_ORIGINS
        sync: false # set to your frontend URL, e.g. https://surebet-scanner.vercel.app
      - key: THEODDSAPI_KEY
        sync: false # optional; leave empty for pure demo mode

  - type: web
    name: surebet-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to your backend URL, e.g. https://surebet-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # set to wss://surebet-api.onrender.com/ws/live

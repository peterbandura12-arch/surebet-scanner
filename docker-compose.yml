services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surebet
      POSTGRES_PASSWORD: surebet
      POSTGRES_DB: surebet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surebet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://surebet:surebet@postgres:5432/surebet
      REDIS_URL: redis://redis:6379/0
      FEED_AUTOSTART: "1"
      FEED_TICK_SECONDS: "5"
      CORS_ORIGINS: http://localhost:3000
      THEODDSAPI_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/live
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
